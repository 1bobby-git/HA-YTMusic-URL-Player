name: Deploy optimization 20260906
on:
  push:
    branches: [release/optimization-20260906]
    paths: [.github/workflows/deploy-optimization-20260906.yml]
permissions:
  contents: write
concurrency:
  group: deploy-optimization-20260906
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PATCH_SPEC: >-
        {"repository":"1bobby-git/HA-YTMusic-URL-Player","branch":"main","base_version":"1.9.3","candidate_version":"1.9.4","summary":["동일 영상의 동시 캐시 미스에서 성공한 추출 결과 재사용; 영상별 잠금은 유휴 시 자동 제거","메타데이터 캐시를 128개로 제한하고 시스템 시각 변경의 TTL 영향 제거","긴 재생을 중단시키는 전체 30초 제한 대신 연결/수신 정체 30초 제한","이미 전송을 시작한 스트림에서 오류가 나면 새 응답·추출을 반복하지 않음","추출기 선택·재생목록·서비스·엔티티·인증 정책 및 라이브러리 버전은 변경하지 않음"],"changes":[{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"from typing import Any, Optional\n","new":"from typing import Any, Optional\nfrom weakref import WeakValueDictionary\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"from aiohttp import web, ClientSession\n","new":"from aiohttp import web, ClientSession, ClientTimeout\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"        self._cache: dict[str, dict[str, Any]] = {}\n","new":"        self._cache: dict[str, dict[str, Any]] = {}\n        self._metadata_locks: WeakValueDictionary[str, asyncio.Lock] = WeakValueDictionary()\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"    async def async_get_metadata(self, video_id: str) -> VideoMetadata:\n        \"\"\"영상의 전체 메타데이터 반환 (썸네일, 제목 등 포함).\"\"\"\n","new":"    async def async_get_metadata(self, video_id: str) -> VideoMetadata:\n        \"\"\"Share cached extraction across simultaneous requests for a video.\"\"\"\n        lock = self._metadata_locks.get(video_id)\n        if lock is None:\n            lock = asyncio.Lock()\n            self._metadata_locks[video_id] = lock\n        async with lock:\n            return await self._async_get_metadata_locked(video_id)\n\n    async def _async_get_metadata_locked(self, video_id: str) -> VideoMetadata:\n        \"\"\"영상의 전체 메타데이터 반환 (썸네일, 제목 등 포함).\"\"\"\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"        now = time.time()\n        cached = self._cache.get(video_id)\n","new":"        now = time.monotonic()\n        cached = self._cache.get(video_id)\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"        self._cache[video_id] = {\n            \"metadata\": metadata,\n            \"expires\": now + STREAM_CACHE_TTL_SECONDS,\n        }\n        return metadata\n","new":"        self._cache[video_id] = {\n            \"metadata\": metadata,\n            \"expires\": now + STREAM_CACHE_TTL_SECONDS,\n        }\n        # Retain a bounded FIFO cache instead of every video ever played.\n        while len(self._cache) > 128:\n            self._cache.pop(next(iter(self._cache)))\n        return metadata\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"                async with self._session.get(audio_url, headers=req_headers, timeout=30) as resp:\n","new":"                async with self._session.get(\n                    audio_url,\n                    headers=req_headers,\n                    timeout=ClientTimeout(\n                        total=None, connect=30, sock_connect=30, sock_read=30\n                    ),\n                ) as resp:\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"        for attempt in range(max_retries):\n            try:\n","new":"        for attempt in range(max_retries):\n            stream_resp: web.StreamResponse | None = None\n            try:\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"            except Exception as err:\n                _LOGGER.error(\"[Proxy] ✗ Stream failed for %s: %s\", video_id, err)\n                if attempt < max_retries - 1:\n","new":"            except Exception as err:\n                _LOGGER.error(\"[Proxy] ✗ Stream failed for %s: %s\", video_id, err)\n                if stream_resp is not None and stream_resp.prepared:\n                    # A second HTTP response cannot be sent after headers/body.\n                    # Let aiohttp close the failed stream; do not fetch it again.\n                    raise\n                if attempt < max_retries - 1:\n"},{"path":"custom_components/ytmusic_url_player/streaming.py","git_blob_sha1":"9a4683b6cef6f8af5708dcee073b8d4322f60689","old":"        try:\n            return await extractor.async_proxy(request, video_id)\n        except Exception as err:\n            _LOGGER.exception(\"Stream failed for %s: %s\", video_id, err)\n            return web.Response(status=500, text=\"Stream failed\")\n","new":"        # Pre-header failures already return an error response in async_proxy.\n        # Post-header failures must propagate so aiohttp closes the connection.\n        return await extractor.async_proxy(request, video_id)\n"},{"path":"custom_components/ytmusic_url_player/manifest.json","git_blob_sha1":"b53a16e2568f5242bca3b2d9fffda6342b6eb7b5","old":"\"version\": \"1.9.3\"","new":"\"version\": \"1.9.4\""}]}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: d5c58703029ea8cfbff4cfd335c59fc49d3fbe98
          path: .release-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Keep helpers outside release source
        run: |
          cp .release-helper/.optimization-release/deploy.py "$RUNNER_TEMP/optimization-deploy.py"
          cp .release-helper/.optimization-release/unittest_report.py "$RUNNER_TEMP/optimization-unittest.py"
          rm -rf .release-helper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source hashes, version and branch protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" check
      - name: Test unchanged baseline
        run: |
          python -m compileall -q custom_components/ytmusic_url_player
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" tests "$RUNNER_TEMP/optimization-baseline.xml"
      - name: Apply exact source patches and update documentation
        run: python "$RUNNER_TEMP/optimization-deploy.py" apply
      - name: Test complete patched integration
        run: |
          python -m compileall -q custom_components/ytmusic_url_player
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" tests "$RUNNER_TEMP/optimization-patched.xml"
      - name: Validate local brand assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          root = Path('custom_components/ytmusic_url_player/brand')
          for name, size in {'icon.png': (256,256), 'icon@2x.png': (512,512)}.items():
              data = (root/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', name
              assert struct.unpack('>II', data[16:24]) == size, name
          PY
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
      - name: Publish verified commit, tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" publish
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-validation
          path: |
            ${{ runner.temp }}/optimization-baseline.xml
            ${{ runner.temp }}/optimization-patched.xml
            ${{ runner.temp }}/optimization-result.json
          if-no-files-found: ignore
