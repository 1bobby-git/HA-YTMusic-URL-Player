name: Deploy optimization 20260906
on:
  push:
    branches: [release/optimization-20260906]
    paths: [.github/workflows/deploy-optimization-20260906.yml]
permissions:
  contents: write
concurrency:
  group: deploy-optimization-20260906
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: d5c58703029ea8cfbff4cfd335c59fc49d3fbe98
          path: .release-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Load original approved patches and fix draft lookup in isolated helper
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          original = subprocess.check_output(['git', 'show', 'c452c84c8f15d2934f41c788cc2b82f2bbe1cbf1:.github/workflows/deploy-optimization-20260906.yml'], text=True)
          spec = json.loads(re.search(r'PATCH_SPEC: >-\s+(\{[^\n]+\})', original).group(1))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PATCH_SPEC=' + json.dumps(spec, ensure_ascii=False) + '\n')
          temp = Path(os.environ['RUNNER_TEMP'])
          source = Path('.release-helper/.optimization-release')
          text = (source/'deploy.py').read_text()
          old = '    release = api("releases/tags/" + state["tag"])'
          assert text.count(old) == 2
          text = text.replace(old, '    release = next(r for r in api("releases?per_page=100") if r["tag_name"] == state["tag"])', 1)
          (temp/'optimization-deploy.py').write_text(text)
          shutil.copyfile(source/'unittest_report.py', temp/'optimization-unittest.py')
          shutil.rmtree('.release-helper')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source hashes, version and branch protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" check
      - name: Test unchanged baseline
        run: |
          python -m compileall -q custom_components/ytmusic_url_player
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" tests "$RUNNER_TEMP/optimization-baseline.xml"
      - name: Apply exact source patches and update documentation
        run: python "$RUNNER_TEMP/optimization-deploy.py" apply
      - name: Update version expectation and model the new aiohttp timeout import
        run: |
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          changes = {
              'tests/test_manifest.py': ('66a22e3f984de2a3c525b9bf696430614a376c8d', [('self.assertEqual("1.9.3", manifest["version"])', 'self.assertEqual("1.9.4", manifest["version"])')]),
              'tests/test_streaming_m3u.py': ('0641fc76956a990cbfd8e1763ddbd0182dedc5c4', [('        aiohttp.ClientSession = object\n', '        aiohttp.ClientSession = object\n        aiohttp.ClientTimeout = types.SimpleNamespace\n')]),
          }
          state_path = Path(os.environ['RUNNER_TEMP'])/'optimization-state.json'
          state = json.loads(state_path.read_text())
          for name, (expected, replacements) in changes.items():
              p = Path(name)
              raw = p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == expected
              text = raw.decode()
              for old, new in replacements:
                  assert text.count(old) == 1
                  text = text.replace(old, new)
              ast.parse(text)
              p.write_text(text)
              state['paths'].append(name)
          state['paths'] = sorted(set(state['paths']))
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Test complete patched integration
        run: |
          python -m compileall -q custom_components/ytmusic_url_player
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" tests "$RUNNER_TEMP/optimization-patched.xml"
      - name: Validate local brand assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          root = Path('custom_components/ytmusic_url_player/brand')
          for name, size in {'icon.png': (256,256), 'icon@2x.png': (512,512)}.items():
              data = (root/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', name
              assert struct.unpack('>II', data[16:24]) == size, name
          PY
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
      - name: Publish verified commit, tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" publish
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-validation
          path: |
            ${{ runner.temp }}/optimization-baseline.xml
            ${{ runner.temp }}/optimization-patched.xml
            ${{ runner.temp }}/optimization-result.json
          if-no-files-found: ignore
